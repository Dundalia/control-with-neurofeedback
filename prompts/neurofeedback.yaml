# Prompts of Experiments 1 and 2 (paper, Appendix "Prompts").
# Placeholders filled at run time: {objective_line}, {subject} (display name of the subject),
# {readout_description}, {fixed_sentence}, {score}.

exp1:
  hidden: "Let's play a game. Each turn, reply with a SINGLE sentence of 10 to 20 words. I will score your sentence by a hidden criterion; scores are typically between 0 and 100 but can fall outside that range. {objective_line} Note: the scoring is not perfectly stable over time — the same sentence can receive different scores on different turns. Reply with only the sentence — no quotes, no explanation, no comments about the game or the score."
  disclosed: "Let's play a game. Each turn, reply with a SINGLE sentence of 10 to 20 words. I will score your sentence. The score is computed from {subject}'s internal activations as the sentence is processed: specifically, it measures {readout_description}. Scores are typically between 0 and 100 but can fall outside that range. {objective_line} Note: the scoring is not perfectly stable over time — the same sentence can receive different scores on different turns. Reply with only the sentence — no quotes, no explanation, no comments about the game or the score."

# Experiment 2 changes only the instructions: the reply is a fixed sentence, and under
# disclosure the score is computed from "your" activations.
exp2:
  hidden: "Let's play a game. Each turn, you must reply with EXACTLY the following sentence: '{fixed_sentence}'. I will score your sentence by a hidden criterion; scores are typically between 0 and 100 but can fall outside that range. {objective_line} Note: the scoring is not perfectly stable over time — the same sentence can receive different scores on different turns. Reply with only that sentence — no quotes, no explanation, no comments about the game or the score."
  disclosed: "Let's play a game. Each turn, you must reply with EXACTLY the following sentence: '{fixed_sentence}'. I will score your sentence. The score is computed from your internal activations as the sentence is processed: specifically, it measures {readout_description}. Scores are typically between 0 and 100 but can fall outside that range. {objective_line} Note: the scoring is not perfectly stable over time — the same sentence can receive different scores on different turns. Reply with only that sentence — no quotes, no explanation, no comments about the game or the score."

objective_line:
  max: "Your goal is to make the score as HIGH as possible."
  min: "Your goal is to make the score as LOW as possible."

feedback: "Score: {score}"

# Experiment 1 only: the reply to a sentence outside the 10-20 word band.
invalid_reply: "Invalid: reply with a single sentence of 10 to 20 words. Score withheld."

# Context of the reads used to build the readouts and their Experiment 1 calibration
# (scripts/build): the instructions of an earlier version of the game, as the only
# user message, followed by random-score turns.
build_context: |
  Let's play a game. Each turn, reply with a SINGLE sentence of your choice. I will
  score your sentence by a hidden criterion; scores are typically between 0 and 100
  but can fall outside that range. {objective_line}
  Note: the scoring is not perfectly stable over time — the same sentence can
  receive different scores on different turns.
  Reply with only the sentence — no quotes, no explanation.

